spring.application.name=sim

spring.datasource.url=jdbc:mysql://localhost:3306/sim
spring.datasource.username=sim_developer_01
spring.datasource.password=${DB_PASSWORD}

# El DDL vive en los scripts de la carpeta database, no lo genera Hibernate: el estandar de
# base de datos exige nombres y restricciones que la generacion automatica no respeta.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HU-027: datos SMTP configurables por variables de entorno para las alertas de vencimiento.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.notificaciones.correo-remitente=${SMTP_FROM:notificaciones@ucr.ac.cr}
# HU-025: hora del ciclo diario de alertas (segundo minuto hora dia mes dia-semana). Para probar en
# el ambiente local se puede ejecutar cada minuto con ALERTAS_TEMPORALES_CRON="0 * * * * *".
app.alertas-temporales.cron=${ALERTAS_TEMPORALES_CRON:0 0 8 * * *}

# HU-031: carpeta donde se guarda la documentacion de respaldo de los expedientes.
app.ruta-documentos=./documentos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# H5 (Sprint 1): Tomcat lee la carga completa aunque supere el limite, asi la respuesta con el mensaje
# de tamano excedido llega a la pantalla en lugar de cortarse la conexion ("Failed to fetch").
server.tomcat.max-swallow-size=-1

# HU-001: enlace de validacion de cuentas. Dominio del frontend al que apunta el enlace del correo y
# si la respuesta del registro muestra ese enlace.
app.dominio-frontend=${SIM_FRONTEND_URL:http://localhost:5175}
app.mostrar-enlace-verificacion=${MOSTRAR_ENLACE_VERIFICACION:true}
