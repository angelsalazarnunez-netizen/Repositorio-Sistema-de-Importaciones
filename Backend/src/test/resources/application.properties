# Configuración que usan solo las pruebas.
# Permite ejecutar la suite desde IntelliJ (clic derecho > Run) o con mvnw test sin pasar
# credenciales por línea de comandos. Si la base local usa otro usuario o contraseña, se
# definen las variables de entorno DB_USER y DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/sim
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
app.ruta-documentos=./target/documentos-prueba
spring.mail.host=localhost
spring.mail.port=25
app.notificaciones.correo-remitente=pruebas@ucr.ac.cr
